<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ub</title>
  <style>
    * { box-sizing: border-box; }

    body {
      background-color: black;
      color: white;
      font-family: 'Trebuchet MS', sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 520px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 1.4em;
    }

    h1 em {
      color: #666;
      font-style: normal;
      font-size: 0.7em;
    }

    .hidden { display: none !important; }

    #login-view {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 60px;
    }

    input, button {
      font-family: inherit;
      font-size: 1em;
      border-radius: 4px;
    }

    input {
      background: none;
      border: 1px solid #444;
      color: white;
      padding: 10px 12px;
      width: 100%;
    }

    input:focus {
      outline: none;
      border-color: #7fffd4;
    }

    button {
      background: none;
      border: 1px solid #555;
      color: white;
      padding: 10px 20px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    button:hover {
      border-color: #7fffd4;
      color: #7fffd4;
    }

    #login-error {
      color: #fca5a5;
      font-size: 0.85em;
      min-height: 1.2em;
      margin: 0;
    }

    #header-nav {
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    #header-nav a {
      color: #666;
      font-size: 0.8em;
      text-decoration: none;
    }

    #header-nav a:hover { color: #7fffd4; }

    #header-nav a.here { color: #e2e8f0; }

    #logout {
      border: none;
      color: #666;
      padding: 0;
      font-size: 0.8em;
    }

    #logout:hover { color: #fca5a5; }

    #notes-widget {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    #notes-value {
      font-family: monospace;
      font-variant-numeric: tabular-nums;
      margin: 0;
    }

    #notes-value em {
      font-style: normal;
      color: #666;
    }

    #timer-widget {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid #1a1a1a;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    #timer-value {
      font-family: monospace;
      font-variant-numeric: tabular-nums;
      margin: 0;
    }

    #week-strip {
      border-bottom: 1px solid #1a1a1a;
      padding-bottom: 10px;
      margin-bottom: 20px;
      font-size: 0.85em;
    }

    #week-strip-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    #week-label {
      color: #666;
      font-size: 0.85em;
      font-family: monospace;
    }

    #week-stale-note {
      color: #666;
      font-size: 0.8em;
    }

    #week-start {
      border: none;
      color: #7fffd4;
      padding: 0;
      font-size: 0.85em;
    }

    #week-add {
      border: none;
      color: #444;
      padding: 0 4px;
      font-size: 1em;
      line-height: 1;
      margin-left: auto;
    }

    #week-add:hover { color: #7fffd4; }

    #week-goal-list li {
      border-bottom: none;
      padding: 4px;
      gap: 10px;
    }

    #week-strip.stale #week-goal-list { opacity: 0.55; }

    .week-toggle {
      width: 13px;
      height: 13px;
      min-width: 13px;
      border: 1px solid #555;
      border-radius: 2px;
      background: none;
      cursor: pointer;
      padding: 0;
    }

    li.done .week-toggle {
      border-color: #7fffd4;
      background: #7fffd4;
    }

    #week-empty {
      color: #555;
      margin: 6px 0 0;
      padding-left: 4px;
    }

    #week-add-form { margin: 4px 0 0; }

    #week-add-form input, .week-edit {
      border: none;
      border-bottom: 1px solid #333;
      border-radius: 0;
      padding: 2px 4px;
      font-size: 1em;
    }

    .week-edit { flex: 1; }

    #add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    #add-form button { white-space: nowrap; }

    #kind-toggle {
      color: #666;
      border-color: #333;
      font-size: 0.85em;
    }

    #kind-toggle.active {
      color: #7fffd4;
      border-color: #7fffd4;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      color: #666;
      font-size: 0.8em;
      border-bottom: 1px solid #1a1a1a;
      padding-bottom: 4px;
      margin: 18px 0 2px;
    }

    .item-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #done-section { margin-top: 14px; }

    #done-section summary {
      color: #666;
      font-size: 0.8em;
      cursor: pointer;
      user-select: none;
    }

    #done-section summary:hover { color: #aaa; }

    .due-chip {
      color: #666;
      font-size: 0.72em;
      font-family: monospace;
      white-space: nowrap;
    }

    li.overdue .due-chip, li.overdue .todo-text { color: #fca5a5; }

    .todo-tag {
      border: none;
      color: #444;
      padding: 2px 6px;
      font-size: 0.9em;
      line-height: 1;
    }

    .todo-tag:hover { color: #7fffd4; }

    .tag-select {
      background: #111;
      color: white;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 0.85em;
      padding: 2px 6px;
    }

    .item-list > li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 4px;
      border-bottom: 1px solid #1a1a1a;
    }

    li.habit .todo-text { color: #888; }

    .habit-mark {
      width: 18px;
      min-width: 18px;
      text-align: center;
      color: #555;
      font-size: 0.85em;
    }

    li.habit.habit-done .habit-mark { color: #7fffd4; }

    li.habit.habit-done .todo-text { color: #666; }

    li.habit-soft .todo-text, li.habit-soft .habit-mark { color: #555; }

    li.habit-stale { opacity: 0.5; }

    .event-pill {
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 0.62em;
      line-height: 1.6;
      color: black;
      white-space: nowrap;
      flex-shrink: 0;
    }

    li.event-past { opacity: 0.45; }

    li.done .event-pill { opacity: 0.35; }

    .event-time {
      color: #666;
      font-size: 0.78em;
      font-family: monospace;
      font-variant-numeric: tabular-nums;
    }

    #habit-note {
      color: #666;
      font-size: 0.72em;
      text-align: right;
      margin: 4px 0 0;
    }

    .todo-toggle {
      width: 18px;
      height: 18px;
      min-width: 18px;
      border: 1px solid #555;
      border-radius: 50%;
      background: none;
      cursor: pointer;
      padding: 0;
    }

    li.done .todo-toggle {
      border-color: #7fffd4;
      background: #7fffd4;
    }

    li.doing .todo-toggle {
      border-color: #7fffd4;
      background: linear-gradient(90deg, #7fffd4 50%, transparent 50%);
    }

    .todo-text {
      flex: 1;
      word-break: break-word;
    }

    li.done .todo-text {
      color: #666;
      text-decoration: line-through;
    }

    .todo-delete {
      border: none;
      color: #444;
      padding: 2px 6px;
      font-size: 1.1em;
      line-height: 1;
    }

    .todo-delete:hover { color: #fca5a5; }

    #empty-state {
      color: #666;
      text-align: center;
      padding: 30px 0;
    }

    #sync-status {
      color: #666;
      font-size: 0.75em;
      text-align: right;
      min-height: 1.2em;
      margin-top: 14px;
      font-family: monospace;
    }

    #sync-status.error { color: #fca5a5; }

    .stat-label {
      display: block;
      color: #aaa;
      font-size: 0.8em;
    }

    .stat-value {
      display: block;
      color: white;
      font-size: 1.7em;
      font-weight: 600;
      margin: 2px 0;
    }

    .stat-sub {
      display: block;
      color: #666;
      font-size: 0.75em;
    }

  </style>
</head>
<body>
  <main>
    <header>
      <h1>ub <em>today</em></h1>
      <nav id="header-nav">
        <a href="/ub/" class="here">today</a>
        <a href="/ub/projects/">projects</a>
        <a href="/ub/metrics/">metrics</a>
        <a href="/ub/calendar/">calendar</a>
        <button id="logout" class="hidden">logout</button>
      </nav>
    </header>

    <form id="login-view" class="hidden">
      <input id="login-user" placeholder="user" autocomplete="username" required>
      <input id="login-pass" type="password" placeholder="password" autocomplete="current-password" required>
      <p id="login-error"></p>
      <button type="submit">Enter</button>
    </form>

    <section id="app-view" class="hidden">
      <div id="notes-widget">
        <span class="stat-label">notes</span>
        <span id="notes-value">—</span>
      </div>
      <div id="timer-widget">
        <span class="stat-label">since became a God</span>
        <span class="stat-value" id="timer-value">—</span>
      </div>
      <div id="week-strip" class="hidden">
        <div id="week-strip-head">
          <span id="week-label"></span>
          <span id="week-stale-note" class="hidden">last week — keep or delete, then</span>
          <button id="week-start" class="hidden"></button>
          <button id="week-add" aria-label="Add weekly goal">+</button>
        </div>
        <ul id="week-goal-list" class="item-list"></ul>
        <p id="week-empty" class="hidden">no goals this week</p>
        <form id="week-add-form" class="hidden">
          <input id="week-add-input" maxlength="200" placeholder="goal for the week" autocomplete="off">
        </form>
      </div>
      <form id="add-form">
        <input id="add-input" placeholder="New todo" maxlength="500" autocomplete="off">
        <button type="button" id="kind-toggle" aria-pressed="false">daily</button>
        <button type="submit">Add</button>
      </form>
      <div class="section-title"><span>today</span><span id="today-count"></span></div>
      <ul id="overdue-list" class="item-list"></ul>
      <ul id="due-list" class="item-list"></ul>
      <ul id="event-list" class="item-list"></ul>
      <ul id="daily-list" class="item-list"></ul>
      <ul id="habit-list" class="item-list"></ul>
      <ul id="done-today-list" class="item-list"></ul>
      <p id="habit-note" class="hidden"></p>
      <p id="empty-state" class="hidden">Nothing to do.</p>
      <details id="done-section" class="hidden">
        <summary id="done-summary"></summary>
        <ul id="done-list" class="item-list"></ul>
      </details>
      <p id="sync-status"></p>
    </section>
  </main>

  <script>
    const API = '/api/ub';
    const TOKEN_KEY = 'ub-token';

    const loginView = document.getElementById('login-view');
    const appView = document.getElementById('app-view');
    const loginError = document.getElementById('login-error');
    const logoutBtn = document.getElementById('logout');
    const addForm = document.getElementById('add-form');
    const addInput = document.getElementById('add-input');
    const bandEls = {
      overdue: document.getElementById('overdue-list'),
      due: document.getElementById('due-list'),
      events: document.getElementById('event-list'),
      daily: document.getElementById('daily-list'),
      habits: document.getElementById('habit-list'),
      doneToday: document.getElementById('done-today-list'),
    };
    const doneListEl = document.getElementById('done-list');
    const doneSection = document.getElementById('done-section');
    const emptyState = document.getElementById('empty-state');
    const kindToggle = document.getElementById('kind-toggle');
    function kindOf(todo) {
      return todo.kind === 'daily' ? 'daily' : 'global';
    }

    function stateOf(todo) {
      if (todo.state === 'doing' || todo.state === 'done') return todo.state;
      return todo.done ? 'done' : 'todo';
    }

    function localDate() {
      return new Date().toLocaleDateString('en-CA');
    }

    function isDoneToday(todo) {
      return todo.doneOn === localDate();
    }
    const syncStatus = document.getElementById('sync-status');

    let todos = [];
    let goalsSnap = null;
    let calSnap = null;
    let calDone = {};
    let weekGoals = null;
    let mutationSeq = 0;
    let weekSeq = 0;
    let lastMutatedAt = 0;

    function isoWeekOf(d) {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const day = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - day);
      const year = date.getUTCFullYear();
      const week = Math.ceil(((date - Date.UTC(year, 0, 1)) / 86400000 + 1) / 7);
      return `${year}-W${String(week).padStart(2, '0')}`;
    }

    function currentWeek() {
      return isoWeekOf(new Date());
    }

    function stampWeek() {
      const d = new Date();
      if (d.getDay() === 0) d.setDate(d.getDate() + 1);
      return isoWeekOf(d);
    }

    function isOverdue(todo) {
      return Boolean(todo.due) && stateOf(todo) !== 'done' && todo.due < localDate();
    }

    function shortDue(iso) {
      return new Date(iso + 'T12:00:00')
        .toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
        .toLowerCase();
    }

    function knownProjects() {
      const keys = [];
      for (const g of (goalsSnap ? goalsSnap.goals : [])) keys.push(g.key);
      for (const t of todos) {
        if (t.project && !keys.includes(t.project)) keys.push(t.project);
      }
      return keys;
    }

    function token() {
      return localStorage.getItem(TOKEN_KEY);
    }

    function api(action, options = {}) {
      return fetch(`${API}?action=${action}`, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(token() ? { Authorization: `Bearer ${token()}` } : {}),
        },
      });
    }

    function showLogin() {
      localStorage.removeItem(TOKEN_KEY);
      appView.classList.add('hidden');
      logoutBtn.classList.add('hidden');
      loginView.classList.remove('hidden');
      document.getElementById('login-user').focus();
    }

    function showApp() {
      loginView.classList.add('hidden');
      appView.classList.remove('hidden');
      logoutBtn.classList.remove('hidden');
      addInput.focus();
    }

    function setStatus(text, isError) {
      syncStatus.textContent = text;
      syncStatus.classList.toggle('error', Boolean(isError));
    }

    function attachTag(todo) {
      const btn = document.createElement('button');
      btn.className = 'todo-tag';
      btn.textContent = '#';
      btn.setAttribute('aria-label', 'Assign to project');
      btn.addEventListener('click', () => {
        const select = document.createElement('select');
        select.className = 'tag-select';
        const first = document.createElement('option');
        first.value = '';
        first.textContent = 'project…';
        select.appendChild(first);
        for (const p of knownProjects()) {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p;
          select.appendChild(opt);
        }
        btn.replaceWith(select);
        select.focus();
        select.addEventListener('change', () => {
          if (!select.value) return;
          todo.project = select.value;
          render();
          mutate('todos', {
            method: 'PATCH',
            body: JSON.stringify({ id: todo.id, project: todo.project }),
          });
        });
        select.addEventListener('blur', () => render());
      });
      return btn;
    }

    function buildItem(todo, opts = {}) {
      const state = kindOf(todo) === 'daily'
        ? (isDoneToday(todo) ? 'done' : 'todo')
        : stateOf(todo);
      const nextState = state === 'todo' ? 'doing' : state === 'doing' ? 'done' : 'todo';
      const li = document.createElement('li');
      li.classList.toggle('done', state === 'done');
      li.classList.toggle('doing', state === 'doing');
      li.classList.toggle('overdue', isOverdue(todo));
      li.dataset.id = todo.id;

      const toggle = document.createElement('button');
      toggle.className = 'todo-toggle';
      toggle.setAttribute('aria-label', kindOf(todo) === 'daily'
        ? (state === 'done' ? 'Mark as not done' : 'Mark as done')
        : `Mark as ${nextState}`);
      toggle.addEventListener('click', () => {
        let patch;
        if (kindOf(todo) === 'daily') {
          todo.doneOn = isDoneToday(todo) ? null : localDate();
          patch = { id: todo.id, doneOn: todo.doneOn };
        } else {
          todo.state = nextState;
          todo.done = nextState === 'done';
          todo.doneOn = nextState === 'done' ? localDate() : null;
          patch = { id: todo.id, state: nextState, doneOn: todo.doneOn };
        }
        render();
        mutate('todos', { method: 'PATCH', body: JSON.stringify(patch) });
      });

      const text = document.createElement('span');
      text.className = 'todo-text';
      text.textContent = todo.text;

      const del = document.createElement('button');
      del.className = 'todo-delete';
      del.textContent = '×';
      del.setAttribute('aria-label', 'Delete todo');
      del.addEventListener('click', () => {
        todos = todos.filter(t => t.id !== todo.id);
        render();
        mutate(`todos&id=${encodeURIComponent(todo.id)}`, { method: 'DELETE' });
      });

      li.append(toggle, text);
      if (todo.due) {
        const chip = document.createElement('span');
        chip.className = 'due-chip';
        chip.textContent = shortDue(todo.due);
        li.append(chip);
      }
      if (opts.tag && knownProjects().length) li.append(attachTag(todo));
      li.append(del);
      return li;
    }

    function eventsToday(today) {
      if (!calSnap || !Array.isArray(calSnap.events)) return [];
      const skipped = new Set(
        (calSnap.calendars || []).filter(c => c.today === false).map(c => c.id)
      );
      const matches = calSnap.events.filter(ev => !skipped.has(ev.cal) && (ev.allDay
        ? ev.start <= today && (ev.end > today || ev.end <= ev.start)
        : ev.start.slice(0, 10) === today));
      return matches.sort((a, b) =>
        (b.allDay === true) - (a.allDay === true) || (a.start < b.start ? -1 : 1)
      );
    }

    function eventKey(ev) {
      return [ev.cal, ev.start, ev.title].join('|');
    }

    function eventState(ev, today) {
      return (calDone[today] || {})[eventKey(ev)] || 'todo';
    }

    function setEventState(ev, today, state) {
      const key = eventKey(ev);
      const day = calDone[today] || {};
      if (state === 'todo') delete day[key];
      else day[key] = state;
      calDone[today] = day;
      render();
      api('calendar-done', {
        method: 'POST',
        body: JSON.stringify({ date: today, key, state }),
      }).then(r => {
        if (!r.ok) throw new Error();
        setStatus('saved');
      }).catch(() => setStatus('sync failed - event state not saved', true));
    }

    function calLabel(ev, cal) {
      const name = cal ? cal.name : ev.cal;
      const short = name.includes('@') ? name.split('@')[0] : name;
      return short.length > 12 ? `${short.slice(0, 11)}…` : short;
    }

    function buildEvent(ev, opts) {
      const state = eventState(ev, opts.today);
      const nextState = state === 'todo' ? 'doing' : state === 'doing' ? 'done' : 'todo';
      const li = document.createElement('li');
      li.classList.toggle('done', state === 'done');
      li.classList.toggle('doing', state === 'doing');
      li.classList.toggle('event-past', Boolean(opts.past));

      const toggle = document.createElement('button');
      toggle.className = 'todo-toggle';
      toggle.setAttribute('aria-label', `Mark as ${nextState}`);
      toggle.addEventListener('click', () => setEventState(ev, opts.today, nextState));

      const text = document.createElement('span');
      text.className = 'todo-text';
      text.textContent = ev.title;
      li.append(toggle, text);

      if (!ev.allDay) {
        const time = document.createElement('span');
        time.className = 'event-time';
        time.textContent = `${ev.start.slice(11, 16)}–${ev.end.slice(11, 16)}`;
        li.append(time);
      }

      const cal = calSnap && (calSnap.calendars || []).find(c => c.id === ev.cal);
      const pill = document.createElement('span');
      pill.className = 'event-pill';
      pill.textContent = calLabel(ev, cal);
      pill.style.background = cal ? cal.color : '#888';
      li.append(pill);
      return li;
    }

    function buildHabit(h, stale) {
      const li = document.createElement('li');
      li.className = 'habit'
        + (h.done ? ' habit-done' : '')
        + (h.soft ? ' habit-soft' : '')
        + (stale ? ' habit-stale' : '');
      const mark = document.createElement('span');
      mark.className = 'habit-mark';
      mark.textContent = h.done ? '◆' : '◇';
      const text = document.createElement('span');
      text.className = 'todo-text';
      text.textContent = h.label;
      li.append(mark, text);
      return li;
    }

    async function mutateWeek(query, init) {
      const seq = ++weekSeq;
      lastMutatedAt = Date.now();
      setStatus('saving...');
      try {
        const r = await api(query, init);
        if (r.status === 401) return showLogin();
        if (!r.ok) throw new Error();
        const data = await r.json();
        lastMutatedAt = Date.now();
        if (seq === weekSeq) {
          weekGoals = data.weekGoals;
          renderWeek();
          setStatus('saved');
        }
      } catch (e) {
        setStatus('sync failed - refresh to see the saved list', true);
      }
    }

    function buildWeekGoal(g) {
      const li = document.createElement('li');
      li.classList.toggle('done', Boolean(g.done));

      const toggle = document.createElement('button');
      toggle.className = 'week-toggle';
      toggle.setAttribute('aria-label', g.done ? 'Mark goal open' : 'Mark goal done');
      toggle.addEventListener('click', () => {
        g.done = !g.done;
        renderWeek();
        mutateWeek('week-goals', {
          method: 'PATCH',
          body: JSON.stringify({ id: g.id, done: g.done }),
        });
      });

      const text = document.createElement('span');
      text.className = 'todo-text';
      text.textContent = g.text;
      text.addEventListener('click', () => {
        const input = document.createElement('input');
        input.className = 'week-edit';
        input.value = g.text;
        input.maxLength = 200;
        text.replaceWith(input);
        input.focus();
        const commit = () => {
          const clean = input.value.replace(/\s+/g, ' ').trim();
          if (!clean || clean === g.text) return renderWeek();
          g.text = clean;
          renderWeek();
          mutateWeek('week-goals', {
            method: 'PATCH',
            body: JSON.stringify({ id: g.id, text: clean }),
          });
        };
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
          if (e.key === 'Escape') {
            input.removeEventListener('blur', commit);
            renderWeek();
          }
        });
      });

      const del = document.createElement('button');
      del.className = 'todo-delete';
      del.textContent = '×';
      del.setAttribute('aria-label', 'Delete goal');
      del.addEventListener('click', () => {
        weekGoals.goals = weekGoals.goals.filter(x => x.id !== g.id);
        renderWeek();
        mutateWeek(`week-goals&id=${encodeURIComponent(g.id)}`, { method: 'DELETE' });
      });

      li.append(toggle, text, del);
      return li;
    }

    function shortWeek(week) {
      return week.slice(5).toLowerCase();
    }

    function renderWeek() {
      const strip = document.getElementById('week-strip');
      const list = document.getElementById('week-goal-list');
      const label = document.getElementById('week-label');
      const staleNote = document.getElementById('week-stale-note');
      const startBtn = document.getElementById('week-start');
      const addBtn = document.getElementById('week-add');
      const empty = document.getElementById('week-empty');
      list.innerHTML = '';
      strip.classList.remove('hidden');
      startBtn.textContent = `start ${shortWeek(stampWeek())}`;

      if (!weekGoals || !weekGoals.week) {
        label.textContent = 'week';
        strip.classList.remove('stale');
        staleNote.classList.add('hidden');
        startBtn.classList.remove('hidden');
        addBtn.classList.add('hidden');
        empty.classList.add('hidden');
        return;
      }

      const stale = weekGoals.week < currentWeek();
      strip.classList.toggle('stale', stale);
      label.textContent = shortWeek(weekGoals.week);
      staleNote.classList.toggle('hidden', !stale);
      startBtn.classList.toggle('hidden', !stale);
      addBtn.classList.toggle('hidden', stale);
      for (const g of weekGoals.goals) list.appendChild(buildWeekGoal(g));
      empty.classList.toggle('hidden', stale || weekGoals.goals.length > 0);
    }

    async function loadWeekGoals() {
      try {
        const r = await api('week-goals');
        if (!r.ok) throw new Error();
        weekGoals = (await r.json()).weekGoals;
      } catch (e) {
        weekGoals = null;
      }
      renderWeek();
    }

    function render() {
      for (const el of Object.values(bandEls)) el.innerHTML = '';
      doneListEl.innerHTML = '';
      const today = localDate();
      const byDue = (a, b) => (a.due < b.due ? -1 : 1);
      const daily = todos.filter(t => kindOf(t) === 'daily');
      const globals = todos.filter(t => kindOf(t) === 'global');
      const open = globals.filter(t => stateOf(t) !== 'done');
      const overdue = open.filter(isOverdue).sort(byDue);
      const dueToday = open.filter(t => t.due === today);
      const doneGlobals = globals.filter(t => stateOf(t) === 'done');
      const doneTodayTodos = doneGlobals.filter(t => t.doneOn === today);
      const doneHistory = doneGlobals.filter(t => t.doneOn !== today);
      const dailyOpen = daily.filter(t => !isDoneToday(t));
      const dailyDone = daily.filter(isDoneToday);

      const notes = goalsSnap && goalsSnap.notes ? goalsSnap.notes : null;
      document.getElementById('notes-value').innerHTML = notes
        ? `${notes.total} <em>total</em> · ${notes.week_daily_avg} <em>/day last week</em>`
        : '—';

      const todayBlock = goalsSnap && goalsSnap.today ? goalsSnap.today : null;
      const stale = todayBlock ? todayBlock.date !== today : false;
      const habits = todayBlock ? todayBlock.habits : [];
      const habitsOpen = stale ? habits : habits.filter(h => !h.done);
      const habitsDone = stale ? [] : habits.filter(h => h.done);

      const now = new Date();
      const dayEvents = eventsToday(today);
      const isPast = ev => !ev.allDay && new Date(ev.end) <= now;
      const eventsOpen = dayEvents.filter(ev => eventState(ev, today) !== 'done' && !isPast(ev));
      const eventsSunk = dayEvents.filter(ev => eventState(ev, today) === 'done' || isPast(ev));

      for (const t of overdue) bandEls.overdue.appendChild(buildItem(t, { tag: !t.project }));
      for (const t of dueToday) bandEls.due.appendChild(buildItem(t, { tag: !t.project }));
      for (const ev of eventsOpen) bandEls.events.appendChild(buildEvent(ev, { today }));
      for (const t of dailyOpen) bandEls.daily.appendChild(buildItem(t));
      for (const h of habitsOpen) bandEls.habits.appendChild(buildHabit(h, stale));
      for (const t of doneTodayTodos) bandEls.doneToday.appendChild(buildItem(t));
      for (const t of dailyDone) bandEls.doneToday.appendChild(buildItem(t));
      for (const h of habitsDone) bandEls.doneToday.appendChild(buildHabit(h, false));
      for (const ev of eventsSunk) {
        bandEls.doneToday.appendChild(buildEvent(ev, {
          today,
          past: isPast(ev) && eventState(ev, today) !== 'done',
        }));
      }

      const left = overdue.length + dueToday.length + eventsOpen.length + dailyOpen.length
        + (stale ? 0 : habitsOpen.length);
      document.getElementById('today-count').textContent =
        left === 0 ? 'clear' : `${left} left`;

      const note = document.getElementById('habit-note');
      if (stale && habits.length) {
        note.textContent = `habits stale — snapshot from ${todayBlock.date}`;
        note.classList.remove('hidden');
      } else {
        note.classList.add('hidden');
      }

      emptyState.classList.toggle(
        'hidden',
        left > 0 || eventsOpen.length > 0 || bandEls.doneToday.children.length > 0
      );

      doneSection.classList.toggle('hidden', doneHistory.length === 0);
      document.getElementById('done-summary').textContent = `done (${doneHistory.length})`;
      for (const t of doneHistory) doneListEl.appendChild(buildItem(t));
    }

    async function mutate(query, init) {
      const seq = ++mutationSeq;
      lastMutatedAt = Date.now();
      setStatus('saving...');
      try {
        const r = await api(query, init);
        if (r.status === 401) return showLogin();
        if (!r.ok) throw new Error();
        const data = await r.json();
        lastMutatedAt = Date.now();
        if (seq === mutationSeq) {
          todos = data.todos;
          render();
          setStatus('saved');
        }
      } catch (e) {
        setStatus('sync failed - refresh to see the saved list', true);
      }
    }

    async function loadGoals() {
      try {
        const r = await api('goals');
        if (!r.ok) throw new Error();
        goalsSnap = (await r.json()).goals;
      } catch (e) {
        goalsSnap = null;
      }
      render();
    }

    async function loadCalendar() {
      try {
        const [calRes, doneRes] = await Promise.all([api('calendar'), api('calendar-done')]);
        if (!calRes.ok || !doneRes.ok) throw new Error();
        calSnap = (await calRes.json()).calendar;
        calDone = (await doneRes.json()).done || {};
      } catch (e) {
        calSnap = null;
      }
      render();
    }

    async function loadTodos() {
      try {
        const r = await api('todos');
        if (r.status === 401) return showLogin();
        if (!r.ok) throw new Error();
        todos = (await r.json()).todos;
        showApp();
        render();
        setStatus('');
      } catch (e) {
        showApp();
        render();
        setStatus('failed to load todos', true);
      }
    }

    loginView.addEventListener('submit', async e => {
      e.preventDefault();
      loginError.textContent = '';
      try {
        const r = await fetch(`${API}?action=login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('login-user').value,
            password: document.getElementById('login-pass').value,
          }),
        });
        const data = await r.json();
        if (!r.ok) {
          loginError.textContent = data.error || 'Login failed';
          return;
        }
        localStorage.setItem(TOKEN_KEY, data.token);
        document.getElementById('login-pass').value = '';
        loadTodos();
        loadGoals();
        loadWeekGoals();
        loadCalendar();
      } catch (e) {
        loginError.textContent = 'Network error';
      }
    });

    const TIMER_EPOCH = new Date('2026-07-15T08:30:00-03:00');
    const timerValue = document.getElementById('timer-value');

    function renderTimer() {
      const total = Math.max(0, Math.floor((Date.now() - TIMER_EPOCH.getTime()) / 1000));
      const days = Math.floor(total / 86400);
      const hours = Math.floor((total % 86400) / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      const pad = n => String(n).padStart(2, '0');
      timerValue.textContent = `${days}d ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    renderTimer();
    setInterval(renderTimer, 1000);

    const weekAddForm = document.getElementById('week-add-form');
    const weekAddInput = document.getElementById('week-add-input');

    document.getElementById('week-start').addEventListener('click', () => {
      const week = stampWeek();
      if (weekGoals) {
        weekGoals.week = week;
        weekGoals.goals = weekGoals.goals.filter(g => !g.done);
      } else {
        weekGoals = { week, goals: [] };
      }
      renderWeek();
      mutateWeek('week-goals', { method: 'PUT', body: JSON.stringify({ week }) });
    });

    document.getElementById('week-add').addEventListener('click', () => {
      weekAddForm.classList.toggle('hidden');
      if (!weekAddForm.classList.contains('hidden')) weekAddInput.focus();
    });

    weekAddForm.addEventListener('submit', e => {
      e.preventDefault();
      const text = weekAddInput.value.replace(/\s+/g, ' ').trim();
      if (!text || !weekGoals) return;
      weekGoals.goals.push({ id: `pending-${Date.now()}`, text, done: false });
      weekAddInput.value = '';
      renderWeek();
      mutateWeek('week-goals', { method: 'POST', body: JSON.stringify({ text }) });
    });

    kindToggle.addEventListener('click', () => {
      const active = kindToggle.classList.toggle('active');
      kindToggle.setAttribute('aria-pressed', String(active));
    });

    addForm.addEventListener('submit', e => {
      e.preventDefault();
      const text = addInput.value.trim();
      if (!text) return;
      const kind = kindToggle.classList.contains('active') ? 'daily' : 'global';
      const pending = {
        id: `pending-${Date.now()}`,
        text,
        state: 'todo',
        done: false,
        created: Date.now(),
        kind,
        doneOn: null,
      };
      todos.unshift(pending);
      addInput.value = '';
      render();
      mutate('todos', { method: 'POST', body: JSON.stringify({ text, kind }) });
    });

    logoutBtn.addEventListener('click', async () => {
      try { await api('logout', { method: 'POST' }); } catch (e) {}
      todos = [];
      showLogin();
    });

    function refreshTodos() {
      if (document.hidden || !token() || appView.classList.contains('hidden')) return;
      if (Date.now() - lastMutatedAt < 5000) return;
      loadTodos();
      loadGoals();
      loadWeekGoals();
      loadCalendar();
    }

    document.addEventListener('visibilitychange', refreshTodos);
    setInterval(refreshTodos, 60000);

    if (token()) {
      loadTodos();
      loadGoals();
      loadWeekGoals();
      loadCalendar();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
