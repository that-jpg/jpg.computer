<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ub</title>
  <style>
    * { box-sizing: border-box; }

    body {
      background-color: black;
      color: white;
      font-family: 'Trebuchet MS', sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 520px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 1.4em;
    }

    h1 em {
      color: #666;
      font-style: normal;
      font-size: 0.7em;
    }

    .hidden { display: none !important; }

    #login-view {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 60px;
    }

    input, button {
      font-family: inherit;
      font-size: 1em;
      border-radius: 4px;
    }

    input {
      background: none;
      border: 1px solid #444;
      color: white;
      padding: 10px 12px;
      width: 100%;
    }

    input:focus {
      outline: none;
      border-color: #7fffd4;
    }

    button {
      background: none;
      border: 1px solid #555;
      color: white;
      padding: 10px 20px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    button:hover {
      border-color: #7fffd4;
      color: #7fffd4;
    }

    #login-error {
      color: #fca5a5;
      font-size: 0.85em;
      min-height: 1.2em;
      margin: 0;
    }

    #logout {
      border: none;
      color: #666;
      padding: 0;
      font-size: 0.8em;
    }

    #logout:hover { color: #fca5a5; }

    #add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    #add-form button { white-space: nowrap; }

    #todo-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #todo-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 4px;
      border-bottom: 1px solid #1a1a1a;
    }

    .todo-toggle {
      width: 18px;
      height: 18px;
      min-width: 18px;
      border: 1px solid #555;
      border-radius: 50%;
      background: none;
      cursor: pointer;
      padding: 0;
    }

    li.done .todo-toggle {
      border-color: #7fffd4;
      background: #7fffd4;
    }

    .todo-text {
      flex: 1;
      word-break: break-word;
    }

    li.done .todo-text {
      color: #666;
      text-decoration: line-through;
    }

    .todo-delete {
      border: none;
      color: #444;
      padding: 2px 6px;
      font-size: 1.1em;
      line-height: 1;
    }

    .todo-delete:hover { color: #fca5a5; }

    #empty-state {
      color: #666;
      text-align: center;
      padding: 30px 0;
    }

    #sync-status {
      color: #666;
      font-size: 0.75em;
      text-align: right;
      min-height: 1.2em;
      margin-top: 14px;
      font-family: monospace;
    }

    #sync-status.error { color: #fca5a5; }

    #fitness {
      border-bottom: 1px solid #333;
      padding-bottom: 20px;
      margin-bottom: 24px;
    }

    #stat-row {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .stat-delta-good { color: #14a37f; }
    .stat-delta-bad { color: #fca5a5; }

    #cut-progress { margin-bottom: 20px; }

    .meter-head {
      display: flex;
      justify-content: space-between;
      color: #aaa;
      font-size: 0.8em;
      margin-bottom: 6px;
    }

    #meter {
      position: relative;
      height: 10px;
      border-radius: 5px;
      background: #0e332a;
      overflow: visible;
    }

    #meter-fill {
      height: 100%;
      border-radius: 5px;
      background: #14a37f;
      min-width: 0;
    }

    #meter-tick {
      position: absolute;
      top: -3px;
      width: 2px;
      height: 16px;
      background: #a3a3a3;
      border-radius: 1px;
    }

    #cut-sub {
      color: #666;
      font-size: 0.72em;
      margin: 6px 0 0;
    }

    .stat-label {
      display: block;
      color: #aaa;
      font-size: 0.8em;
    }

    .stat-value {
      display: block;
      color: white;
      font-size: 1.7em;
      font-weight: 600;
      margin: 2px 0;
    }

    .stat-sub {
      display: block;
      color: #666;
      font-size: 0.75em;
    }

    #chart-wrap {
      position: relative;
      width: 100%;
    }

    #chart-wrap svg {
      display: block;
      width: 100%;
      height: auto;
    }

    #chart-tooltip {
      position: absolute;
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 6px 9px;
      font-size: 0.75em;
      color: #e2e8f0;
      pointer-events: none;
      white-space: nowrap;
      display: none;
      z-index: 5;
    }

    #chart-tooltip .tt-muted { color: #888; }

    #chart-caption {
      color: #666;
      font-size: 0.72em;
      margin: 6px 0 0;
    }

    #fitness details { margin-top: 8px; }

    #fitness summary {
      color: #666;
      font-size: 0.75em;
      cursor: pointer;
    }

    #fitness table {
      border-collapse: collapse;
      font-family: monospace;
      font-size: 0.78em;
      color: #aaa;
      margin-top: 6px;
    }

    #fitness td, #fitness th {
      padding: 2px 12px 2px 0;
      text-align: right;
    }

    #fitness td:first-child, #fitness th:first-child { text-align: left; }

    #fitness th {
      color: #666;
      font-weight: normal;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ub <em>dashboard</em></h1>
      <button id="logout" class="hidden">logout</button>
    </header>

    <form id="login-view" class="hidden">
      <input id="login-user" placeholder="user" autocomplete="username" required>
      <input id="login-pass" type="password" placeholder="password" autocomplete="current-password" required>
      <p id="login-error"></p>
      <button type="submit">Enter</button>
    </form>

    <section id="app-view" class="hidden">
      <section id="fitness" class="hidden">
        <div id="stat-row">
          <div id="deficit-stat">
            <span class="stat-label">7-day calorie deficit</span>
            <span class="stat-value" id="deficit-value">—</span>
            <span class="stat-sub" id="deficit-sub"></span>
          </div>
          <div id="weight-stat" class="hidden">
            <span class="stat-label">current weight</span>
            <span class="stat-value" id="weight-value">—</span>
            <span class="stat-sub" id="weight-sub"></span>
          </div>
        </div>
        <div id="cut-progress" class="hidden">
          <div class="meter-head">
            <span id="cut-title"></span>
            <span id="cut-days"></span>
          </div>
          <div id="meter">
            <div id="meter-fill"></div>
            <div id="meter-tick"></div>
          </div>
          <p id="cut-sub"></p>
        </div>
        <div id="chart-wrap">
          <svg id="chart" viewBox="0 0 480 170" role="img" aria-label="Calories per day, last 7 days plus today"></svg>
          <div id="chart-tooltip"></div>
        </div>
        <p id="chart-caption"></p>
        <details>
          <summary>data</summary>
          <table id="fitness-table"></table>
        </details>
      </section>

      <form id="add-form">
        <input id="add-input" placeholder="New todo" maxlength="500" autocomplete="off">
        <button type="submit">Add</button>
      </form>
      <ul id="todo-list"></ul>
      <p id="empty-state" class="hidden">Nothing to do.</p>
      <p id="sync-status"></p>
    </section>
  </main>

  <script>
    const API = '/api/ub';
    const TOKEN_KEY = 'ub-token';

    const loginView = document.getElementById('login-view');
    const appView = document.getElementById('app-view');
    const loginError = document.getElementById('login-error');
    const logoutBtn = document.getElementById('logout');
    const addForm = document.getElementById('add-form');
    const addInput = document.getElementById('add-input');
    const listEl = document.getElementById('todo-list');
    const emptyState = document.getElementById('empty-state');
    const syncStatus = document.getElementById('sync-status');

    let todos = [];
    let saveTimer = null;

    function token() {
      return localStorage.getItem(TOKEN_KEY);
    }

    function api(action, options = {}) {
      return fetch(`${API}?action=${action}`, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(token() ? { Authorization: `Bearer ${token()}` } : {}),
        },
      });
    }

    function showLogin() {
      localStorage.removeItem(TOKEN_KEY);
      appView.classList.add('hidden');
      logoutBtn.classList.add('hidden');
      loginView.classList.remove('hidden');
      document.getElementById('login-user').focus();
    }

    function showApp() {
      loginView.classList.add('hidden');
      appView.classList.remove('hidden');
      logoutBtn.classList.remove('hidden');
      addInput.focus();
    }

    function setStatus(text, isError) {
      syncStatus.textContent = text;
      syncStatus.classList.toggle('error', Boolean(isError));
    }

    function render() {
      listEl.innerHTML = '';
      emptyState.classList.toggle('hidden', todos.length > 0);
      for (const todo of todos) {
        const li = document.createElement('li');
        li.classList.toggle('done', todo.done);

        const toggle = document.createElement('button');
        toggle.className = 'todo-toggle';
        toggle.setAttribute('aria-label', todo.done ? 'Mark as not done' : 'Mark as done');
        toggle.addEventListener('click', () => {
          todo.done = !todo.done;
          render();
          scheduleSave();
        });

        const text = document.createElement('span');
        text.className = 'todo-text';
        text.textContent = todo.text;

        const del = document.createElement('button');
        del.className = 'todo-delete';
        del.textContent = '×';
        del.setAttribute('aria-label', 'Delete todo');
        del.addEventListener('click', () => {
          todos = todos.filter(t => t.id !== todo.id);
          render();
          scheduleSave();
        });

        li.append(toggle, text, del);
        listEl.appendChild(li);
      }
    }

    function scheduleSave() {
      setStatus('saving...');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 400);
    }

    async function save() {
      try {
        const r = await api('todos', { method: 'PUT', body: JSON.stringify({ todos }) });
        if (r.status === 401) return showLogin();
        if (!r.ok) throw new Error();
        setStatus('saved');
      } catch (e) {
        setStatus('sync failed - changes not saved', true);
      }
    }

    const SVG_NS = 'http://www.w3.org/2000/svg';
    const BAR_FILL = '#14a37f';
    const CHART = { w: 480, h: 170, left: 40, right: 6, top: 16, bottom: 22 };

    function svgEl(name, attrs) {
      const el = document.createElementNS(SVG_NS, name);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    function fmt(n) {
      return n == null ? '—' : Math.round(n).toLocaleString('en-US');
    }

    function dayLabel(iso, partial) {
      if (partial) return 'today';
      return new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short' });
    }

    function barPath(x, y, w, baseY) {
      const r = Math.min(4, (baseY - y) / 2, w / 2);
      return `M${x},${baseY} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${baseY} Z`;
    }

    function renderDeficitStat(f) {
      const value = document.getElementById('deficit-value');
      const sub = document.getElementById('deficit-sub');
      if (f.deficit_total == null) {
        value.textContent = '—';
        sub.textContent = 'no completed days with intake data yet';
        return;
      }
      value.textContent = `${fmt(f.deficit_total)} kcal`;
      const parts = [`avg ${fmt(f.deficit_avg)}/day over ${f.days_counted} days`];
      if (f.days_estimated > 0) {
        parts.push(`out estimated at ~${fmt(f.tdee_estimate)} for ${f.days_estimated}/${f.days_counted}`);
      }
      sub.textContent = parts.join(' · ');
    }

    function renderChart(f) {
      const svg = document.getElementById('chart');
      const tooltip = document.getElementById('chart-tooltip');
      svg.innerHTML = '';
      const days = f.days;
      const plotW = CHART.w - CHART.left - CHART.right;
      const plotH = CHART.h - CHART.top - CHART.bottom;
      const baseY = CHART.top + plotH;
      const band = plotW / days.length;
      const barW = Math.min(24, band * 0.55);
      const maxVal = Math.max(3000, ...days.flatMap(d => [d.in || 0, d.out || 0]));
      const yMax = Math.ceil(maxVal / 500) * 500;
      const yOf = v => CHART.top + plotH * (1 - v / yMax);

      for (let v = 1000; v <= yMax; v += 1000) {
        svg.append(svgEl('line', {
          x1: CHART.left, x2: CHART.w - CHART.right, y1: yOf(v), y2: yOf(v),
          stroke: '#1a1a1a', 'stroke-width': 1,
        }));
        const tick = svgEl('text', {
          x: CHART.left - 6, y: yOf(v) + 3, fill: '#666',
          'font-size': 9, 'text-anchor': 'end',
          style: 'font-family: monospace; font-variant-numeric: tabular-nums',
        });
        tick.textContent = fmt(v);
        svg.append(tick);
      }
      svg.append(svgEl('line', {
        x1: CHART.left, x2: CHART.w - CHART.right, y1: baseY, y2: baseY,
        stroke: '#333', 'stroke-width': 1,
      }));

      let lastCompleted = null;
      for (const d of days) if (!d.partial && d.in != null) lastCompleted = d;

      days.forEach((d, i) => {
        const cx = CHART.left + band * i + band / 2;
        const x = cx - barW / 2;

        if (d.in != null) {
          const bar = svgEl('path', { d: barPath(x, yOf(d.in), barW, baseY), fill: BAR_FILL });
          if (d.partial) bar.setAttribute('opacity', 0.45);
          svg.append(bar);
        }

        if (d.out != null) {
          svg.append(svgEl('line', {
            x1: cx - barW / 2 - 6, x2: cx + barW / 2 + 6, y1: yOf(d.out), y2: yOf(d.out),
            stroke: '#a3a3a3', 'stroke-width': 2, 'stroke-linecap': 'round',
            opacity: d.out_estimated ? 0.55 : 1,
          }));
        }

        if (d === lastCompleted && d.in != null) {
          const cap = svgEl('text', {
            x: cx, y: yOf(d.in) - 5, fill: '#e2e8f0', 'font-size': 10, 'text-anchor': 'middle',
            style: 'font-family: monospace',
          });
          cap.textContent = fmt(d.in);
          svg.append(cap);
        }

        const label = svgEl('text', {
          x: cx, y: CHART.h - 8, fill: d.partial ? '#aaa' : '#666',
          'font-size': 10, 'text-anchor': 'middle',
        });
        label.textContent = dayLabel(d.date, d.partial);
        svg.append(label);

        const hit = svgEl('rect', {
          x: CHART.left + band * i, y: CHART.top, width: band, height: plotH,
          fill: 'transparent',
        });
        hit.addEventListener('mousemove', e => {
          const date = new Date(d.date + 'T12:00:00')
            .toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
          const outText = d.out == null ? '—' : (d.out_estimated ? `~${fmt(d.out)} est` : fmt(d.out));
          const deficitText = d.deficit == null ? '—' : `${d.deficit >= 0 ? '+' : ''}${fmt(d.deficit)}`;
          tooltip.innerHTML =
            `${date}${d.partial ? ' <span class="tt-muted">(partial)</span>' : ''}<br>` +
            `in ${fmt(d.in)} <span class="tt-muted">·</span> out ${outText}<br>` +
            `deficit ${deficitText}`;
          tooltip.style.display = 'block';
          const wrap = tooltip.parentElement.getBoundingClientRect();
          const ttW = tooltip.offsetWidth;
          let px = e.clientX - wrap.left + 12;
          if (px + ttW > wrap.width) px = e.clientX - wrap.left - ttW - 12;
          tooltip.style.left = `${Math.max(0, px)}px`;
          tooltip.style.top = `${e.clientY - wrap.top - 10}px`;
        });
        hit.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
        svg.append(hit);
      });
    }

    function renderFitnessTable(f) {
      const table = document.getElementById('fitness-table');
      table.innerHTML = '';
      const head = document.createElement('tr');
      for (const h of ['date', 'in', 'out', 'deficit']) {
        const th = document.createElement('th');
        th.textContent = h;
        head.appendChild(th);
      }
      table.appendChild(head);
      for (const d of f.days) {
        const tr = document.createElement('tr');
        const cells = [
          d.date + (d.partial ? ' *' : ''),
          fmt(d.in),
          d.out == null ? '—' : (d.out_estimated ? `~${fmt(d.out)}` : fmt(d.out)),
          d.deficit == null ? '—' : `${d.deficit >= 0 ? '+' : ''}${fmt(d.deficit)}`,
        ];
        for (const c of cells) {
          const td = document.createElement('td');
          td.textContent = c;
          tr.appendChild(td);
        }
        table.appendChild(tr);
      }
    }

    function shortDate(iso) {
      return new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function renderWeight(w) {
      const tile = document.getElementById('weight-stat');
      const cut = document.getElementById('cut-progress');
      if (!w) {
        tile.classList.add('hidden');
        cut.classList.add('hidden');
        return;
      }
      tile.classList.remove('hidden');
      cut.classList.remove('hidden');

      document.getElementById('weight-value').textContent = `${w.current.toFixed(1)} kg`;
      const delta = w.current - w.cut_start;
      const deltaClass = delta <= 0 ? 'stat-delta-good' : 'stat-delta-bad';
      const deltaText = `${delta > 0 ? '+' : ''}${delta.toFixed(1)} kg since ${shortDate(w.cut_start_date)}`;
      document.getElementById('weight-sub').innerHTML =
        `logged ${shortDate(w.date)} · <span class="${deltaClass}">${deltaText}</span>`;

      const planned = w.cut_start - w.cut_target;
      const lostFrac = Math.min(Math.max((w.cut_start - w.current) / planned, 0), 1);
      const expectedFrac = Math.min(Math.max((w.cut_start - w.expected_today) / planned, 0), 1);
      document.getElementById('meter-fill').style.width = `${lostFrac * 100}%`;
      document.getElementById('meter-tick').style.left = `calc(${expectedFrac * 100}% - 1px)`;
      document.getElementById('cut-title').textContent =
        `cut ${w.cut_start.toFixed(1)} → ${w.cut_target.toFixed(1)} kg`;
      document.getElementById('cut-days').textContent =
        w.days_left > 0 ? `${w.days_left} days left` : 'ended';
      document.getElementById('cut-sub').textContent =
        `target ${w.cut_target.toFixed(1)} by ${shortDate(w.cut_end_date)} · on-pace today ${w.expected_today.toFixed(1)} (gray tick)`;
    }

    function renderFitness(f) {
      const panel = document.getElementById('fitness');
      if (!f || !Array.isArray(f.days) || f.days.length === 0) {
        panel.classList.add('hidden');
        return;
      }
      panel.classList.remove('hidden');
      renderWeight(f.weight);
      renderDeficitStat(f);
      renderChart(f);
      renderFitnessTable(f);
      const captionParts = ['bars: calories in', 'gray tick: calories out'];
      if (f.days.some(d => d.out_estimated)) captionParts.push('~ estimated (TDEE)');
      if (f.days.some(d => d.partial)) captionParts.push('today still logging');
      document.getElementById('chart-caption').textContent = captionParts.join(' · ');
    }

    async function loadFitness() {
      try {
        const r = await api('fitness');
        if (!r.ok) throw new Error();
        renderFitness((await r.json()).fitness);
      } catch (e) {
        document.getElementById('fitness').classList.add('hidden');
      }
    }

    async function loadTodos() {
      try {
        const r = await api('todos');
        if (r.status === 401) return showLogin();
        if (!r.ok) throw new Error();
        todos = (await r.json()).todos;
        showApp();
        render();
        setStatus('');
      } catch (e) {
        showApp();
        render();
        setStatus('failed to load todos', true);
      }
    }

    loginView.addEventListener('submit', async e => {
      e.preventDefault();
      loginError.textContent = '';
      try {
        const r = await fetch(`${API}?action=login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('login-user').value,
            password: document.getElementById('login-pass').value,
          }),
        });
        const data = await r.json();
        if (!r.ok) {
          loginError.textContent = data.error || 'Login failed';
          return;
        }
        localStorage.setItem(TOKEN_KEY, data.token);
        document.getElementById('login-pass').value = '';
        loadTodos();
        loadFitness();
      } catch (e) {
        loginError.textContent = 'Network error';
      }
    });

    addForm.addEventListener('submit', e => {
      e.preventDefault();
      const text = addInput.value.trim();
      if (!text) return;
      todos.unshift({ id: crypto.randomUUID(), text, done: false, created: Date.now() });
      addInput.value = '';
      render();
      scheduleSave();
    });

    logoutBtn.addEventListener('click', async () => {
      try { await api('logout', { method: 'POST' }); } catch (e) {}
      todos = [];
      showLogin();
    });

    if (token()) {
      loadTodos();
      loadFitness();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
