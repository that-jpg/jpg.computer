<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ub física 3</title>
  <style>
    * { box-sizing: border-box; }

    body {
      background-color: black;
      color: white;
      font-family: 'Trebuchet MS', sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    main { width: 100%; max-width: 980px; }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }

    h1 { margin: 0; font-size: 1.4em; }

    h1 em { color: #666; font-style: normal; font-size: 0.7em; }

    h1 #pct {
      color: #7fffd4;
      font-size: 0.7em;
      font-variant-numeric: tabular-nums;
    }

    header a { color: #666; font-size: 0.8em; text-decoration: none; margin-left: 12px; }

    header a:hover { color: #7fffd4; }

    #topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    #total { color: #aaa; font-size: 0.95em; font-variant-numeric: tabular-nums; }

    #total strong { color: white; font-weight: 600; }

    #as-of {
      color: #666;
      font-size: 0.72em;
      font-family: monospace;
    }

    #as-of.stale { color: #fca5a5; }

    #next-up {
      border: 1px solid #2a4;
      border-color: rgba(127, 255, 212, 0.35);
      border-radius: 6px;
      padding: 8px 12px;
      margin: 10px 0 4px;
      font-size: 0.9em;
      color: #7fffd4;
    }

    #next-up .due { color: #aaa; }

    #no-dates {
      color: #666;
      font-size: 0.8em;
      margin: 6px 0 0;
    }

    #status { color: #fca5a5; font-size: 0.85em; }

    .chapter { margin-top: 26px; }

    .chapter-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .chapter-head h2 {
      margin: 0;
      font-size: 1.02em;
      font-weight: 600;
    }

    .chapter-head h2 span { color: #666; font-weight: 400; }

    .tally {
      color: #aaa;
      font-size: 0.85em;
      font-variant-numeric: tabular-nums;
    }

    .ch-pct {
      color: #7fffd4;
      font-size: 0.8em;
      font-variant-numeric: tabular-nums;
    }

    .blocks {
      color: #666;
      font-size: 0.75em;
      font-variant-numeric: tabular-nums;
    }

    .badge {
      font-size: 0.7em;
      border-radius: 4px;
      padding: 2px 7px;
      border: 1px solid #333;
      color: #888;
      white-space: nowrap;
    }

    .badge.done { color: #7fffd4; border-color: rgba(127, 255, 212, 0.5); }

    .badge.due_soon { color: #fcd34d; border-color: rgba(252, 211, 77, 0.5); }

    .badge.behind { color: #fca5a5; border-color: rgba(252, 165, 165, 0.5); }

    .meter {
      height: 3px;
      background: #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .meter div { height: 100%; background: #7fffd4; border-radius: 2px; }

    .block-group { margin-bottom: 8px; }

    .block-label {
      color: #555;
      font-size: 0.68em;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }

    .cell {
      width: 30px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.66em;
      font-variant-numeric: tabular-nums;
      border-radius: 3px;
      border: 1px solid #222;
      color: #777;
    }

    .cell.solved {
      background: #7fffd4;
      border-color: #7fffd4;
      color: black;
      font-weight: 600;
    }

    .cell.ad-first { margin-left: 12px; }

    #legend {
      margin-top: 26px;
      color: #555;
      font-size: 0.72em;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    #legend .cell { display: inline-flex; }

    @media (max-width: 520px) {
      .cell { width: 27px; height: 21px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ub <em>física 3</em> <span id="pct"></span></h1>
      <nav>
        <a href="/ub/">dashboard</a>
        <a href="/ub/calendar/">calendar</a>
      </nav>
    </header>

    <div id="topbar">
      <span id="total"></span>
      <span id="as-of"></span>
    </div>
    <div id="next-up" class="hidden" hidden></div>
    <p id="no-dates" hidden></p>
    <p id="status"></p>

    <div id="chapters"></div>

    <div id="legend" hidden>
      <span><span class="cell solved" style="width:22px">7</span> solved</span>
      <span><span class="cell" style="width:22px">7</span> missing</span>
      <span>MC = múltipla escolha · Q = questões · P = problemas (gap = adicionais)</span>
      <span>log via Vapula on Telegram</span>
    </div>
  </main>

  <script>
    const API = '/api/ub';
    const TOKEN_KEY = 'ub-token';
    const STALE_MS = 45 * 60 * 1000;
    const BADGE_TEXT = {
      done: 'done',
      behind: 'behind',
      due_soon: 'due soon',
      on_track: 'on track',
      no_date: 'no date',
    };

    const totalEl = document.getElementById('total');
    const pctEl = document.getElementById('pct');
    const asOfEl = document.getElementById('as-of');
    const nextUpEl = document.getElementById('next-up');
    const noDatesEl = document.getElementById('no-dates');
    const statusEl = document.getElementById('status');
    const chaptersEl = document.getElementById('chapters');
    const legendEl = document.getElementById('legend');

    function token() {
      return localStorage.getItem(TOKEN_KEY);
    }

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function setAsOf(snap) {
      if (!snap) { asOfEl.textContent = ''; return; }
      const updated = new Date(snap.updated);
      const stale = Date.now() - updated.getTime() > STALE_MS;
      asOfEl.classList.toggle('stale', stale);
      const when = `${updated.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).toLowerCase()} ${pad(updated.getHours())}:${pad(updated.getMinutes())}`;
      asOfEl.textContent = stale ? `stale — as of ${when}` : `as of ${when}`;
    }

    function blockGroups(ch) {
      return [
        { label: 'MC', from: 1, to: ch.q_start - 1 },
        { label: 'Q', from: ch.q_start, to: ch.p_start - 1 },
        { label: 'P', from: ch.p_start, to: ch.max },
      ];
    }

    function renderChapter(ch) {
      const section = document.createElement('section');
      section.className = 'chapter';
      const solved = new Set(ch.solved);

      const head = document.createElement('div');
      head.className = 'chapter-head';
      const title = document.createElement('h2');
      title.innerHTML = `${ch.ch} <span>· ${ch.title}</span>`;
      const tally = document.createElement('span');
      tally.className = 'tally';
      tally.textContent = `${solved.size}/${ch.max}`;
      const chPct = document.createElement('span');
      chPct.className = 'ch-pct';
      chPct.textContent = `${(100 * solved.size / ch.max).toFixed(1)}%`;
      const blocks = document.createElement('span');
      blocks.className = 'blocks';
      blocks.textContent = blockGroups(ch)
        .map(b => `${b.label} ${[...solved].filter(n => n >= b.from && n <= b.to).length}/${b.to - b.from + 1}`)
        .join(' · ');
      const badge = document.createElement('span');
      badge.className = `badge ${ch.status}`;
      badge.textContent = ch.deadline && ch.status !== 'done'
        ? `${BADGE_TEXT[ch.status]} · due ${ch.deadline}`
        : BADGE_TEXT[ch.status];
      head.append(title, tally, chPct, blocks, badge);
      section.appendChild(head);

      const meter = document.createElement('div');
      meter.className = 'meter';
      const fill = document.createElement('div');
      fill.style.width = `${(100 * solved.size) / ch.max}%`;
      meter.appendChild(fill);
      section.appendChild(meter);

      for (const block of blockGroups(ch)) {
        if (block.to < block.from) continue;
        const group = document.createElement('div');
        group.className = 'block-group';
        const label = document.createElement('div');
        label.className = 'block-label';
        label.textContent = block.label === 'MC' ? 'múltipla escolha'
          : block.label === 'Q' ? 'questões' : 'problemas';
        const grid = document.createElement('div');
        grid.className = 'grid';
        for (let n = block.from; n <= block.to; n++) {
          const cell = document.createElement('span');
          cell.className = 'cell';
          if (solved.has(n)) cell.classList.add('solved');
          if (block.label === 'P' && n === ch.ad_start) cell.classList.add('ad-first');
          cell.textContent = n;
          cell.title = `${ch.ch}.${n} — ${solved.has(n) ? 'solved' : 'missing'}`;
          grid.appendChild(cell);
        }
        group.append(label, grid);
        section.appendChild(group);
      }
      return section;
    }

    function render(snap) {
      setAsOf(snap);
      if (!snap) {
        statusEl.textContent = 'no snapshot yet — log an exercise to Vapula or wait for the aiur push';
        return;
      }
      statusEl.textContent = '';
      const total = snap.chapters.reduce((sum, ch) => sum + ch.max, 0);
      const solved = snap.chapters.reduce((sum, ch) => sum + ch.solved.length, 0);
      totalEl.innerHTML = `<strong>${solved}</strong> / ${total} solved`;
      const pct = total ? (100 * solved / total).toFixed(1) : '0.0';
      pctEl.textContent = `${pct}%`;
      document.title = `ub física 3 · ${pct}%`;
      if (snap.next_up != null) {
        const ch = snap.chapters.find(c => c.ch === snap.next_up);
        nextUpEl.hidden = false;
        nextUpEl.innerHTML = `next up: ch ${ch.ch} — ${ch.title}` +
          (ch.deadline ? ` <span class="due">· due ${ch.deadline}</span>` : '');
      } else {
        nextUpEl.hidden = false;
        nextUpEl.textContent = 'every item in the book is solved';
      }
      noDatesEl.hidden = snap.has_dates;
      if (!snap.has_dates) {
        noDatesEl.textContent = 'no aula dates yet — send "aula <n> <date>" lines to Vapula to enable pace tracking';
      }
      chaptersEl.replaceChildren(...snap.chapters.map(renderChapter));
      legendEl.hidden = false;
    }

    async function load() {
      if (!token()) { location.href = '/ub/'; return; }
      try {
        const res = await fetch(`${API}?action=fisica3`, {
          headers: { Authorization: `Bearer ${token()}` },
        });
        if (res.status === 401) { location.href = '/ub/'; return; }
        const data = await res.json();
        render(data.fisica3);
      } catch (e) {
        statusEl.textContent = 'failed to load física 3 snapshot';
      }
    }

    load();
    window.addEventListener('focus', load);
    setInterval(load, 60 * 1000);
  </script>
</body>
</html>
